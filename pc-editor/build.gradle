plugins {
    id 'java'
    id 'application'
}

group = 'com.auto_persona.pc'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

application {
    mainClass = 'com.auto_persona.pc.Main'
}

// Task to create a fat JAR
task fatJar(type: Jar) {
    manifest { attributes 'Main-Class': 'com.auto_persona.pc.Main' }
    archiveClassifier = 'fat'
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Task to create a minimal JRE via jlink
task createRuntimeImage(type: Exec) {
    dependsOn fatJar
    def jlinkPath = System.getProperty('java.home') + '/bin/jlink'
    def outputDir = layout.buildDirectory.dir('runtime').get().asFile
    doFirst { outputDir.deleteDir() }
    commandLine jlinkPath,
        '--add-modules', 'java.desktop,java.logging',
        '--strip-debug', '--no-header-files', '--no-man-pages',
        '--compress', 'zip-6',
        '--output', outputDir.absolutePath
}

// Task to create .exe via jpackage
task createExe(type: Exec) {
    dependsOn createRuntimeImage
    def jpackagePath = System.getProperty('java.home') + '/bin/jpackage'
    def inputDir = layout.buildDirectory.dir('package').get().asFile
    def jarFile = fatJar.archiveFile.get().asFile
    doFirst {
        inputDir.mkdirs()
        // Copy fat jar into input dir
        ant.copy(file: jarFile, todir: inputDir)
    }
    commandLine jpackagePath,
        '--type', 'app-image',
        '--name', 'auto_persona_editor',
        '--app-version', version,
        '--input', inputDir.absolutePath,
        '--main-jar', jarFile.name,
        '--main-class', 'com.auto_persona.pc.Main',
        '--runtime-image', layout.buildDirectory.dir('runtime').get().asFile.absolutePath,
        '--dest', layout.buildDirectory.dir('exe').get().asFile.absolutePath,
        '--description', 'auto_persona 存档编辑器',
        '--vendor', 'Auto Persona'
}
